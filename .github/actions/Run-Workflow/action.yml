name: 'Run Workflow'
description: 'Dispatches a workflow and optionally waits with bounded, rate-aware polling.'
inputs:
  repo:
    description: 'format: {owner}/{name}'
    required: true
  workflow:
    description: 'workflow yml filename'
    required: true
  ref:
    description: 'the ref to invoke the workflow at'
    required: true
  goal:
    description: 'start (dispatch only), complete (any conclusion), or success (fail on child failure)'
    default: 'start'
  access_token:
    description: 'Explicit token; mutually exclusive with App credentials. Never falls back to GH_TOKEN.'
    required: false
  app_id:
    description: 'GitHub App ID; the installation must cover the target repo with Actions: write'
    required: false
  app_private_key:
    description: 'GitHub App private key, supplied from a secret'
    required: false
  wait_name_filter:
    description: 'The run must have this text in its name; use a unique caller identifier'
    required: false
  poll_interval_seconds:
    description: 'Polling interval, at least 30 seconds'
    default: '60'
  timeout_minutes:
    description: 'Total dispatch and wait deadline; 1-55 minutes to stay within App token lifetime'
    default: '45'
  field1:
    description: 'Workflow input in the form name=value'
  field2:
    description: 'Workflow input in the form name=value'
  field3:
    description: 'Workflow input in the form name=value'
  field4:
    description: 'Workflow input in the form name=value'
  field5:
    description: 'Workflow input in the form name=value'
  field6:
    description: 'Workflow input in the form name=value'
  field16:
    description: 'Legacy alias for field6'
  field7:
    description: 'Workflow input in the form name=value'
  field8:
    description: 'Workflow input in the form name=value'
  field9:
    description: 'Workflow input in the form name=value'
  field10:
    description: 'Workflow input in the form name=value'
  debug:
    description: 'Log rate-limit response headers when true; never logs tokens or workflow inputs'
outputs:
  run_id:
    description: 'Matched run ID (empty for goal=start)'
    value: ${{ steps.dispatch.outputs.run_id }}
  run_url:
    description: 'Matched run URL (empty for goal=start)'
    value: ${{ steps.dispatch.outputs.run_url }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_GOAL: ${{ inputs.goal }}
        INPUT_ACCESS_TOKEN: ${{ inputs.access_token }}
        INPUT_APP_ID: ${{ inputs.app_id }}
        INPUT_APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
        INPUT_POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      run: node "${{ github.action_path }}/run-workflow.cjs" --validate
    - name: Create target repository installation token
      id: app-token
      if: ${{ inputs.app_id != '' }}
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ steps.validate.outputs.owner }}
        repositories: ${{ steps.validate.outputs.repository }}
        permission-actions: write
    - name: Dispatch and await workflow
      id: dispatch
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_GOAL: ${{ inputs.goal }}
        INPUT_ACCESS_TOKEN: ${{ steps.app-token.outputs.token || inputs.access_token }}
        INPUT_WAIT_NAME_FILTER: ${{ inputs.wait_name_filter }}
        INPUT_POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_FIELD1: ${{ inputs.field1 }}
        INPUT_FIELD2: ${{ inputs.field2 }}
        INPUT_FIELD3: ${{ inputs.field3 }}
        INPUT_FIELD4: ${{ inputs.field4 }}
        INPUT_FIELD5: ${{ inputs.field5 }}
        INPUT_FIELD6: ${{ inputs.field6 || inputs.field16 }}
        INPUT_FIELD7: ${{ inputs.field7 }}
        INPUT_FIELD8: ${{ inputs.field8 }}
        INPUT_FIELD9: ${{ inputs.field9 }}
        INPUT_FIELD10: ${{ inputs.field10 }}
        GITHUB_API_URL: ${{ github.api_url }}
      run: node "${{ github.action_path }}/run-workflow.cjs"
